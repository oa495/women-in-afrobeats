<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <title>Nigerian Women's Names in Afrobeats</title>
</head>

<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
  </noscript>
  <div id="app"></div>
  <!-- Lets Netlify detect the name suggestion form at build time; the app submits it from App.vue -->
  <form name="suggest-name" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="name">
    <input name="songs">
    <input name="bot-field">
  </form>
  <!-- built files will be auto injected -->
</body>

</html>
